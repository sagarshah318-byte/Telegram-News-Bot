name: NSE SLBM CSV download test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-nse-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NSE SLBM page using HTTP/1.1
        run: |
          mkdir -p artifacts
          curl -sS -L --http1.1 --max-time 60 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -o artifacts/nse_landing.html \
            -w "CURL_HTTP_STATUS=%{http_code} HTTP_VERSION=%{http_version} BYTES=%{size_download}\\n" \
            "https://www.nseindia.com/market-data/securities-lending-and-borrowing"
      - name: Inspect NSE HTML for SLBM data and CSV references
        run: python slbm-bot/inspect_nse_html.py
      - name: Save NSE page for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-slbm-page-inspection
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7
