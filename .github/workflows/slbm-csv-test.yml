name: NSE SLBM CSV download test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nse-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Open NSE and download the visible SLBM CSV
        run: python slbm-bot/test_nse_csv.py
      - name: Save downloaded CSV for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-slbm-csv-test
          path: artifacts/*.csv
          if-no-files-found: warn
          retention-days: 7
