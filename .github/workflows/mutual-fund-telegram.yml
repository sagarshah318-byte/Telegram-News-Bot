name: Mutual Fund Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mutual-fund-telegram-bot
  cancel-in-progress: false

jobs:
  poll-and-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll Telegram and reply
        env:
          MF_BOT_TOKEN: ${{ secrets.MF_BOT_TOKEN }}
          MF_CHAT_ID: ${{ secrets.MF_CHAT_ID }}
        run: python mf-bot/bot.py
      - name: Save Telegram update offset
        run: |
          if ! git diff --quiet -- mf-bot/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mf-bot/state.json
            git commit -m "Update mutual fund bot polling state"
            git pull --rebase origin main
            git push
          fi
