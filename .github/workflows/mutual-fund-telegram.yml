name: Mutual Fund Telegram Bot

on:
  repository_dispatch:
    types: [mf_lookup]
  workflow_dispatch:
    inputs:
      scheme:
        description: Mutual fund scheme name
        required: true
        type: string
      chat_id:
        description: Telegram chat ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mutual-fund-lookup-${{ github.event.client_payload.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  lookup-and-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fund data and reply
        env:
          MF_BOT_TOKEN: ${{ secrets.MF_BOT_TOKEN }}
          MF_SCHEME: ${{ github.event.client_payload.scheme || inputs.scheme }}
          MF_CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id }}
        run: python mf-bot/bot.py
