name: Diagnose Mutual Fund Telegram webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram webhook status (safe output only)
        env:
          MF_BOT_TOKEN: ${{ secrets.MF_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("MF_BOT_TOKEN", "")
          if not token:
              raise SystemExit("MF_BOT_TOKEN is missing from repository Actions secrets.")
          url = f"https://api.telegram.org/bot{token}/getWebhookInfo"
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.loads(r.read())
          if not data.get("ok"):
              raise SystemExit("Telegram getWebhookInfo failed.")
          info = data["result"]
          print("Webhook URL:", info.get("url") or "(not set)")
          print("Pending updates:", info.get("pending_update_count", 0))
          print("Allowed updates:", info.get("allowed_updates", []))
          print("Last error date:", info.get("last_error_date", "(none)"))
          print("Last error message:", info.get("last_error_message", "(none)"))
          print("Max connections:", info.get("max_connections", "(default)"))
          PY
