name: Register Mutual Fund Telegram webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Register Telegram webhook securely
        env:
          MF_BOT_TOKEN: ${{ secrets.MF_BOT_TOKEN }}
          MF_WEBHOOK_SECRET: ${{ secrets.MF_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["MF_BOT_TOKEN"]
          secret = os.environ["MF_WEBHOOK_SECRET"]
          url = "https://mutual-fund-telegram.sagar-shah318.workers.dev"
          payload = {
              "url": url,
              "secret_token": secret,
              "allowed_updates": json.dumps(["message", "edited_message"])
          }
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/setWebhook",
              data=urllib.parse.urlencode(payload).encode(),
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read())
          if not result.get("ok"):
              raise SystemExit("Telegram rejected webhook registration: " + str(result))
          print("Webhook registered successfully.")
          print("Telegram response:", result.get("description", "OK"))
          PY
