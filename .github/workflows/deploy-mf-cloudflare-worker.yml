name: Deploy Mutual Fund Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "mf-bot/cloudflare-worker.js"
      - ".github/workflows/deploy-mf-cloudflare-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing or empty"
            exit 1
          fi
          echo "Cloudflare API token is present."

      - name: Deploy Mutual Fund Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 73d0e2fb31eccddb53e5d61a3fdb51e2
        run: |
          npx --yes wrangler@4 deploy mf-bot/cloudflare-worker.js \
            --name mutual-fund-telegram \
            --compatibility-date 2026-11-04 \
            --keep-vars
