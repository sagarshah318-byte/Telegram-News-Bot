name: REDBOXINDIA to Telegram

on:
  schedule:
    # Poll Redbox RSS every 5 minutes for faster Telegram alerts
    - cron: "*/5 * * * *"
    # Keep the existing weekday BSE price-band PDF schedule at 19:30 IST
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbox-telegram-poller
  cancel-in-progress: false

jobs:
  forward-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Forward new X posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redbox-bot/bot.py
      - name: Send new BSE price band notice PDFs
        if: (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1-5') || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python redbox-bot/bse_price_band.py
