name: REDBOXINDIA to Telegram

on:
  schedule:
    - cron: "30 2-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbox-telegram-poller
  cancel-in-progress: false

jobs:
  forward-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Forward new X posts
        run: python redbox-bot/bot.py
