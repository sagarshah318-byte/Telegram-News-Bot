name: REDBOXINDIA to Telegram

on:
  push:
    paths:
      - ".github/test-9-to-10pm"
  schedule:
    - cron: "30 2-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redbox-telegram-poller
  cancel-in-progress: false

jobs:
  forward-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Forward new X posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_FROM: ${{ github.event_name == 'push' && '2026-11-03T21:00:00+05:30' || '' }}
          TEST_TO: ${{ github.event_name == 'push' && '2026-11-03T22:00:00+05:30' || '' }}
        run: python redbox-bot/bot.py
